name: ABO web clean checkout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Run the public Windows launcher with Python absent from PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          if (Get-Command py.exe, python.exe, python3.exe -ErrorAction SilentlyContinue) {
            throw 'A system Python is visible to the test.'
          }
          .\start-web.cmd --prepare-only --no-browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem .cache/abo-web-python -Recurse -Filter .ready -Force)) {
            throw 'The launcher did not install its portable Python.'
          }
          .\.venv-web\Scripts\python.exe scripts/smoke_web.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-web\Scripts\python.exe -m unittest tests.unit.test_abo_resume tests.unit.test_abo_journal -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the public Unix launcher with Python absent from PATH
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tools=$(mktemp -d)
          for name in sh dirname sed uname awk mkdir curl wget sha256sum shasum mv rm tar gzip; do
            if path=$(command -v "$name"); then ln -s "$path" "$tools/$name"; fi
          done
          PATH="$tools" sh ./start-web.cmd --prepare-only --no-browser
          for ready in .cache/abo-web-python/*/.ready; do test -f "$ready"; done
          .venv-web/bin/python scripts/smoke_web.py
          .venv-web/bin/python -m unittest tests.unit.test_abo_resume tests.unit.test_abo_journal -q
