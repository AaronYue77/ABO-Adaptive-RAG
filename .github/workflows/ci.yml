name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + mypy + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Use the same resolver and locked dependencies locally and in both matrix jobs.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Lockfile in sync
        run: uv lock --check

      - name: Install
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Prepare the public ABO catalogue used by the source integration tests
        run: uv run --locked python -m app.abo.web_setup

      - name: Ruff format check
        run: uv run --locked python -m ruff format --check .

      - name: Ruff lint
        run: uv run --locked python -m ruff check .

      - name: Mypy
        run: uv run --locked python -m mypy

      - name: Pytest
        run: >-
          uv run --locked python -m pytest -q
          --cov=app --cov=eval
          --cov-report=term:skip-covered
          --cov-fail-under=70
